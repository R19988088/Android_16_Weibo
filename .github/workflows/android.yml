name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: sh gradlew testDebugUnitTest

      - name: Build debug APK
        run: sh gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish raw debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          cp "$APK" Weibo-debug.apk
          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest --title "Latest debug APK" --notes "Latest debug APK from main."
          gh release upload debug-latest Weibo-debug.apk --clobber
